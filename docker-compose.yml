# Base PostgreSQL locale pour le développement (NE PAS utiliser en production).
# Démarrage : docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: aviron-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rowing
      POSTGRES_PASSWORD: rowing
      POSTGRES_DB: rowing
    ports:
      # Port 5433 côté Windows/Mac pour éviter un conflit avec un PostgreSQL déjà installé
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rowing -d rowing"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
